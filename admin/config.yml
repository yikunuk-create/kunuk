backend:
  name: github
  repo: yikunuk-create/kunuk
  branch: main
  base_url: https://kunukarchive.vercel.app
  auth_endpoint: /api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "works"
    label: "Works"
    files:
      - name: "works"
        label: "Works List"
        file: "data/works.json"
        fields:
          - label: "Works"
            name: "works"
            widget: "list"
            summary: "{{fields.code}} — {{fields.title}} ({{fields.status}})"
            fields:
              - { label: "Catalog Code", name: "code", widget: "string", hint: "e.g. NUK—001" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Year", name: "year", widget: "string", default: "2026" }
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["In production", "Coming soon", "Reserved", "Released"]
                default: "Coming soon"
              - label: "Show in fullscreen hero"
                name: "featured"
                widget: "boolean"
                default: false
                hint: "Only the first 4 featured works appear in the top hero list"
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Video (optional, MP4)", name: "video", widget: "file", required: false, hint: "If set, plays instead of the image in the hero" }
