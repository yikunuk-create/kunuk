<!DOCTYPE html>
<html lang="en" data-theme="light">
<script>
try{ if(localStorage.getItem('kunuk-theme') === 'dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUNUK — Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B;
  --ink:#F2F2F0;
  --grey:#8A8A8C;
  --grey-dim:#48484A;
  --line:#1A1A1C;
  --media:#111113;
  --ikb:#1F49FF;
}
[data-theme="light"]{
  --bg:#FFFFFF;
  --ink:#0A0A0B;
  --grey:#7A7A7C;
  --grey-dim:#B8B8BA;
  --line:#EBEBED;
  --media:#F4F4F5;
  --ikb:#002FA7;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Archivo',sans-serif;
  transition:background .35s,color .35s;
}
.bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 24px;
}
.bar a.back{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--grey);text-decoration:none;transition:color .25s;
}
.bar a.back:hover{color:var(--ink)}
.bar .brand{
  font-weight:600;letter-spacing:.34em;font-size:15px;
  text-transform:uppercase;
}
.bar .brand a{color:inherit;text-decoration:none}
.bar .chip{
  background:none;border:none;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--grey);
}
.wrap{max-width:1200px;margin:0 auto;padding:70px 24px 120px}
h1{
  font-weight:600;font-size:clamp(40px,7vw,86px);
  letter-spacing:-.02em;line-height:1;margin-bottom:10px;
}
.sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--grey);margin-bottom:56px;
}
.rows{border-top:1px solid var(--line)}
.row{
  display:grid;
  grid-template-columns:96px 110px 1fr 70px 150px;
  gap:20px;align-items:center;
  padding:16px 2px;border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit;
}
.row .thumb{
  width:96px;height:64px;background:var(--media);
  border:1px solid var(--line);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.row .thumb img,.row .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.row .thumb .ph{
  font-family:'IBM Plex Mono',monospace;font-size:8px;
  letter-spacing:.14em;color:var(--grey-dim);
}
.row .code,.row .year,.row .status{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--grey);
}
.row .title{
  font-weight:600;font-size:clamp(17px,2.4vw,24px);letter-spacing:-.01em;
  transition:color .25s;
}
.row:hover .title{color:var(--ikb)}
.row .status{text-align:right}
footer{
  padding:22px 24px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;letter-spacing:.14em;
  color:var(--grey-dim);text-transform:uppercase;
}
@media (max-width:640px){
  .row{grid-template-columns:72px 1fr 90px;gap:14px}
  .row .thumb{width:72px;height:48px}
  .row .code,.row .year{display:none}
}
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="/">&larr; Home</a>
  <div class="brand"><a href="/">KUNUK</a></div>
  <button class="chip" id="themeBtn">Dark</button>
</div>

<div class="wrap">
  <h1>Index</h1>
  <div class="sub">Kunuk Archive — Complete Works</div>
  <div class="rows" id="rows"></div>
</div>

<footer>
  <div>&copy; 2026 KUNUK</div>
  <div>NUK&mdash;000 / SEOUL&ndash;GYEONGGI</div>
</footer>

<script>
(function(){
  /* theme: shares the same saved preference as the home page */
  var root = document.documentElement;
  var btn = document.getElementById('themeBtn');
  var theme = 'light';
  try{ if(localStorage.getItem('kunuk-theme') === 'dark') theme = 'dark'; }catch(e){}
  function apply(t){
    theme = t;
    root.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? 'Light' : 'Dark';
  }
  apply(theme);
  btn.addEventListener('click', function(){
    var next = theme === 'dark' ? 'light' : 'dark';
    try{ localStorage.setItem('kunuk-theme', next); }catch(e){}
    apply(next);
  });

  /* archive list: every work in the CMS, in order */
  fetch('/data/works.json', {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      if(!data || !Array.isArray(data.works)) return;
      var rows = document.getElementById('rows');
      data.works.forEach(function(w, i){
        if(!w) return;
        var a = document.createElement('a');
        a.className = 'row';
        a.href = '/#upcoming';
        var media = w.video
          ? '<video src="'+w.video+'" muted loop playsinline autoplay></video>'
          : (w.image
              ? '<img src="'+w.image+'" alt="'+(w.title||'')+'" loading="lazy">'
              : '<span class="ph">'+(w.code||'NUK')+'</span>');
        a.innerHTML =
          '<span class="thumb">'+media+'</span>' +
          '<span class="code">'+(w.code||'')+'</span>' +
          '<span class="title">'+(w.title||'Untitled')+'</span>' +
          '<span class="year">'+(w.year||'')+'</span>' +
          '<span class="status">'+(w.status||'')+'</span>';
        rows.appendChild(a);
      });
    })
    .catch(function(){});
})();
</script>

</body>
</html>
